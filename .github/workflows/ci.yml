name: CI pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: main.django.test
      PYTHONPATH: src/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.13"

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check

      - name: Run Mypy
        run: uv run mypy

      - name: Run Tests
        run: uv run pytest
